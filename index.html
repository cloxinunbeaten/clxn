<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gotunuzu skm</title>
<style>
  :root{
    --bg-0:#0b0b0d;
    --bg-1:#141416;
    --silver:#d9dee6;
    --silver-soft:rgba(217,222,230,0.28);
    --steel:#8a9099;
    --glass:rgba(255,255,255,0.045);
    --glass-border:rgba(255,255,255,0.09);
    --text-0:#f4f5f7;
    --text-1:#aeb2b9;
    --text-2:#6f7379;
    --online:#23a55a;
    --idle:#f0b232;
    --dnd:#f23f43;
    --offline:#80848e;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100vh;
    background:var(--bg-0);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text-0);
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    position:relative;
  }

  .field{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(217,222,230,0.10), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 90%, rgba(138,144,153,0.10), transparent 60%),
      var(--bg-0);
    overflow:hidden;
  }

  .mote{
    position:absolute;
    bottom:-10px;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--silver);
    box-shadow:0 0 6px 1px var(--silver-soft);
    opacity:0;
    animation:rise linear infinite;
  }

  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.7; }
    90%{ opacity:0.18; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .mote{ animation:none; display:none; }
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:380px;
    padding:38px 28px 30px;
    border-radius:22px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03),
      0 30px 60px -20px rgba(0,0,0,0.75),
      0 0 40px -12px var(--silver-soft);
    text-align:center;
  }

  .avatar-wrap{
    position:relative;
    width:104px;
    height:104px;
    margin:0 auto 18px;
  }

  .avatar-ring{
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:conic-gradient(from 0deg, #eef1f5, #8a9099, #eef1f5);
    filter:blur(0.5px);
    animation:spin 7s linear infinite;
  }

  @media (prefers-reduced-motion: reduce){
    .avatar-ring{ animation:none; }
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .avatar-inner{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:var(--bg-1);
    padding:4px;
  }

  .avatar-inner img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:var(--bg-1);
  }

  .status-dot{
    position:absolute;
    right:-2px;
    bottom:-2px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--offline);
    border:4px solid var(--bg-1);
    box-shadow:0 0 12px 2px var(--offline);
    transition:background 0.4s, box-shadow 0.4s;
  }

  .name{
    font-family:"Sora","Inter",sans-serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 2px;
  }

  .tag{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    font-size:12px;
    color:var(--text-2);
    margin:0 0 14px;
  }

  .status-line{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:var(--text-1);
    margin-bottom:16px;
  }

  .status-line .pip{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--offline);
    box-shadow:0 0 6px 1px var(--offline);
  }

  .activity{
    display:none;
    align-items:center;
    gap:10px;
    text-align:left;
    background:rgba(255,255,255,0.035);
    border:1px solid var(--glass-border);
    border-radius:14px;
    padding:10px 12px;
    margin-bottom:16px;
  }

  .activity.show{ display:flex; }

  .activity img{
    width:38px;
    height:38px;
    border-radius:8px;
    object-fit:cover;
    flex-shrink:0;
  }

  .activity .act-text{ min-width:0; }

  .activity .act-title{
    font-size:12.5px;
    color:var(--text-0);
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .activity .act-sub{
    font-size:11.5px;
    color:var(--text-2);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .bio-wrap{ display:none; }
  .bio-wrap.show{ display:block; }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--glass-border), transparent);
    margin:0 0 16px;
  }

  .bio{
    text-align:left;
    font-size:13.5px;
    line-height:1.55;
    color:var(--text-1);
    margin:0 0 16px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:6px;
  }

  .social-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--glass-border);
    color:var(--text-1);
    transition:transform 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .social-btn svg{ width:20px; height:20px; }

  .social-btn:hover{
    transform:translateY(-2px);
    color:var(--text-0);
    border-color:rgba(255,255,255,0.22);
    box-shadow:0 8px 20px -6px var(--silver-soft);
  }

  .enter-screen{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    background:var(--bg-0);
    cursor:pointer;
    transition:opacity 0.6s ease;
  }

  .enter-screen.hide{
    opacity:0;
    pointer-events:none;
  }

  .enter-title{
    font-family:"Sora","Inter",sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.14em;
    color:var(--text-0);
    text-transform:uppercase;
    animation:pulse-glow 2.4s ease-in-out infinite;
  }

  @keyframes pulse-glow{
    0%,100%{ text-shadow:0 0 10px rgba(255,255,255,0.15); opacity:0.75; }
    50%{ text-shadow:0 0 22px rgba(255,255,255,0.45); opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .enter-title{ animation:none; }
  }

  /* ===== Müzik kontrolü — sol üst, animasyonlu ===== */
  .music-control{
    position:fixed;
    left:20px;
    top:20px;
    z-index:5;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .music-toggle{
    position:relative;
    flex-shrink:0;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease, transform 0.15s ease, border-color 0.15s ease, box-shadow 0.3s ease;
  }

  .music-toggle.show{
    opacity:1;
    pointer-events:auto;
  }

  .music-toggle:hover{
    transform:translateY(-2px);
  }

  .music-toggle.playing{
    border-color:rgba(217,222,230,0.55);
    box-shadow:0 0 16px 2px var(--silver-soft);
    animation:music-pulse 1.6s ease-in-out infinite;
  }

  @keyframes music-pulse{
    0%,100%{ box-shadow:0 0 10px 1px var(--silver-soft); }
    50%{ box-shadow:0 0 20px 4px var(--silver-soft); }
  }

  @media (prefers-reduced-motion: reduce){
    .music-toggle.playing{ animation:none; }
  }

  /* Ses dalgası çubukları — sadece çalarken görünür ve zıplar */
  .eq-bars{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:2.5px;
    width:20px;
    height:18px;
  }

  .eq-bars span{
    display:block;
    width:3px;
    border-radius:2px;
    background:currentColor;
    height:4px;
    animation:eq-bounce 0.9s ease-in-out infinite;
    animation-play-state:paused;
  }

  .music-toggle.playing .eq-bars span{
    animation-play-state:running;
  }

  .eq-bars span:nth-child(1){ animation-delay:0s; }
  .eq-bars span:nth-child(2){ animation-delay:0.2s; }
  .eq-bars span:nth-child(3){ animation-delay:0.4s; }
  .eq-bars span:nth-child(4){ animation-delay:0.15s; }

  @keyframes eq-bounce{
    0%,100%{ height:4px; }
    50%{ height:16px; }
  }

  .music-toggle .mute-icon{
    display:none;
    width:20px;
    height:20px;
  }

  .music-toggle.muted .eq-bars{ display:none; }
  .music-toggle.muted .mute-icon{ display:block; }

  /* ===== Ses seviyesi kaydırıcısı ===== */
  .volume-wrap{
    display:flex;
    align-items:center;
    height:46px;
    padding:0 16px 0 4px;
    border-radius:23px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    max-width:0;
    padding-left:0;
    padding-right:0;
    opacity:0;
    overflow:hidden;
    pointer-events:none;
    transform:translateX(-6px);
    transition:max-width 0.35s ease, opacity 0.25s ease, transform 0.35s ease, padding 0.35s ease, border-color 0.2s ease;
  }

  .music-control.expanded .volume-wrap{
    max-width:150px;
    padding:0 18px 0 16px;
    opacity:1;
    pointer-events:auto;
    transform:translateX(0);
  }

  .volume-slider{
    -webkit-appearance:none;
    appearance:none;
    width:110px;
    height:4px;
    border-radius:2px;
    background:linear-gradient(to right, var(--silver) 0%, var(--silver) var(--vol,80%), rgba(255,255,255,0.14) var(--vol,80%), rgba(255,255,255,0.14) 100%);
    outline:none;
    cursor:pointer;
    transition:box-shadow 0.15s ease;
  }

  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:var(--text-0);
    box-shadow:0 0 0 3px rgba(255,255,255,0.12), 0 0 10px 1px var(--silver-soft);
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .volume-slider:hover::-webkit-slider-thumb,
  .volume-slider:active::-webkit-slider-thumb{
    transform:scale(1.15);
    box-shadow:0 0 0 4px rgba(255,255,255,0.16), 0 0 14px 2px var(--silver-soft);
  }

  .volume-slider::-moz-range-track{
    height:4px;
    border-radius:2px;
    background:rgba(255,255,255,0.14);
  }

  .volume-slider::-moz-range-progress{
    height:4px;
    border-radius:2px;
    background:var(--silver);
  }

  .volume-slider::-moz-range-thumb{
    width:13px;
    height:13px;
    border:none;
    border-radius:50%;
    background:var(--text-0);
    box-shadow:0 0 0 3px rgba(255,255,255,0.12), 0 0 10px 1px var(--silver-soft);
    cursor:pointer;
    transition:transform 0.15s ease;
  }

  .volume-slider:hover::-moz-range-thumb{
    transform:scale(1.15);
  }

  @media (prefers-reduced-motion: reduce){
    .volume-wrap{ transition:opacity 0.2s ease; }
  }
</style>
</head>

<div class="enter-screen" id="enterScreen">
  <div class="enter-title">Click to Enter</div>
</div>

<div class="card">

  </div>

  <div class="bio-wrap" id="bioWrap">

            <p class="bio" id="bioText"></p>
  </div>

  <div class="socials" id="socials"></div>
</div>

<div class="music-control" id="musicControl">

    </span>
    <svg class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5Z" fill="currentColor" stroke="none"/>
      <path d="M22 9l-6 6M16 9l6 6"/>

  </button>
  <div class="volume-wrap" id="volumeWrap">
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" step="1" title="Ses seviyesi" aria-label="Ses seviyesi">
  </div>
</div>

function renderSocials(){
  const wrap = document.getElementById('socials');
  wrap.innerHTML = '';
  SOCIALS.filter(s => s.enabled && s.url).forEach(s => {
    const a = document.createElement('a');
    a.className = 'social-btn';
    a.href = s.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = s.name;
    a.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${s.icon}</svg>`;
    wrap.appendChild(a);
  });
}
renderSocials();

(function(){
  const field = document.getElementById('field');
  const N = 20;
  for(let i=0;i<N;i++){
    const m = document.createElement('div');
    m.className = 'mote';
    const left = Math.random()*100;
    const delay = Math.random()*14;
    const dur = 9 + Math.random()*8;
    const drift = (Math.random()*60-30).toFixed(0)+'px';
    m.style.left = left+'%';
    m.style.animationDelay = delay+'s';
    m.style.animationDuration = dur+'s';
    m.style.setProperty('--drift', drift);
    field.appendChild(m);
  }
})();

const DISCORD_ID = '1368780659484528702';
const STATUS_LABEL = { online:'Çevrimiçi', idle:'Idle', dnd:'Do Not Disturb', offline:'Offline' };
const STATUS_COLOR = { online:'#23a55a', idle:'#f0b232', dnd:'#f23f43', offline:'#80848e' };

function avatarUrl(user){
  if(user.avatar){
    const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
    return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
  }
  const idx = Number(BigInt(user.id) >> 22n) % 6;
  return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
}

function applyStatus(status){
  const color = STATUS_COLOR[status] || STATUS_COLOR.offline;
  const dot = document.getElementById('statusDot');
  const pip = document.getElementById('statusPip');
  dot.style.background = color;
  dot.style.boxShadow = `0 0 12px 2px ${color}`;
  pip.style.background = color;
  pip.style.boxShadow = `0 0 6px 1px ${color}`;
  document.getElementById('statusText').textContent = STATUS_LABEL[status] || 'Çevrimdışı';
}

function applyActivity(data){
  const box = document.getElementById('activityBox');
  const img = document.getElementById('activityImg');
  const title = document.getElementById('activityTitle');
  const sub = document.getElementById('activitySub');

  if(data.listening_to_spotify && data.spotify){
    box.classList.add('show');
    img.style.display = '';
    img.src = data.spotify.album_art_url || '';
    title.textContent = data.spotify.song || 'Spotify';
    sub.textContent = data.spotify.artist ? `${data.spotify.artist} · Spotify'da dinliyor` : "Spotify'da dinliyor";
    return;
  }

  const game = (data.activities || []).find(a => a.type === 0);
  if(game){
    box.classList.add('show');
    if(game.assets && game.assets.large_image){
      img.style.display = '';
      const asset = game.assets.large_image;
      img.src = asset.startsWith('mp:')
        ? `https://media.discordapp.net/${asset.replace('mp:', '')}`
        : `https://cdn.discordapp.com/app-assets/${game.application_id}/${asset}.png`;
    } else {
      img.style.display = 'none';
    }
    title.textContent = game.name || 'Oyun';
    sub.textContent = game.details || game.state || 'oynuyor';
    return;
  }

  const custom = (data.activities || []).find(a => a.type === 4);
  if(custom && custom.state){
    box.classList.add('show');
    img.style.display = 'none';
    title.textContent = custom.state;
    sub.textContent = 'Özel durum';
    return;
  }

  box.classList.remove('show');
}

function applyBio(data){
  const wrap = document.getElementById('bioWrap');
  const text = document.getElementById('bioText');
  // Lanyard KV üzerinden "bio" anahtarı okunuyor.
  // Discord bot'a DM: .set bio Senin metnin
  const kv = data.kv || {};
  const bio = kv.bio || kv.about || '';
  if(bio){
    text.textContent = bio;
    wrap.classList.add('show');
  }else{
    wrap.classList.remove('show');
  }
}

async function loadPresence(){
  try{
    const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
    const json = await res.json();
    if(!json.success) throw new Error('Lanyard isteği başarısız');

    const data = json.data;
    const user = data.discord_user;

    document.getElementById('avatar').src = avatarUrl(user);
    document.getElementById('displayName').textContent = user.global_name || user.username;
    document.getElementById('userTag').textContent = '@' + user.username;

    applyStatus(data.discord_status);
    applyActivity(data);
    applyBio(data);
  }catch(err){
    document.getElementById('statusText').textContent = 'Durum şu an alınamıyor';
    document.getElementById('userTag').textContent = '@cloxin';
    console.error(err);
  }
}

const enterScreen = document.getElementById('enterScreen');
const bgMusic = document.getElementById('bgMusic');
const musicControl = document.getElementById('musicControl');
const musicToggle = document.getElementById('musicToggle');
const volumeSlider = document.getElementById('volumeSlider');
let musicStarted = false;

bgMusic.volume = Number(volumeSlider.value) / 100;

function updateSliderFill(){
  volumeSlider.style.setProperty('--vol', volumeSlider.value + '%');
}
updateSliderFill();

// Tıkla ve gir ekranı — tarayıcılar kullanıcı etkileşimi olmadan
// otomatik ses çalmasına izin vermiyor, bu yüzden müzik bu tıklamayla başlıyor.
enterScreen.addEventListener('click', () => {
  if(!musicStarted){
    bgMusic.play().catch(()=>{});
    musicStarted = true;
  }
  enterScreen.classList.add('hide');
  musicToggle.classList.add('show', 'playing');
  musicControl.classList.add('expanded');
  setTimeout(() => enterScreen.remove(), 700);
});

// Düğme: sesi tamamen kapat/aç (mute toggle)
musicToggle.addEventListener('click', () => {
  bgMusic.muted = !bgMusic.muted;
  musicToggle.classList.toggle('muted', bgMusic.muted);
  musicToggle.classList.toggle('playing', !bgMusic.muted);
});

// Kaydırıcı: ses seviyesini ayarla (0 -> otomatik sessize alır)
volumeSlider.addEventListener('input', () => {
  const vol = Number(volumeSlider.value) / 100;
  bgMusic.volume = vol;
  updateSliderFill();

  if(vol === 0){
    bgMusic.muted = true;
    musicToggle.classList.add('muted');
    musicToggle.classList.remove('playing');
  } else {
    if(bgMusic.muted){
      bgMusic.muted = false;
    }
    musicToggle.classList.remove('muted');
    musicToggle.classList.add('playing');
  }
});

loadPresence();
setInterval(loadPresence, 20000);
</script>
