<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Site Offline</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI Variable","Segoe UI",sans-serif;color:#f3f3f3;background:#080808}
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;margin:0;padding:24px;place-items:center;background:radial-gradient(ellipse at 50% 34%,#111726 0%,#080808 58%)}
    main{width:min(100%,480px);padding:38px 30px;text-align:center;background:#0b0b0b;border:1px solid #242424;border-radius:10px;box-shadow:0 24px 80px #0008}
    .mark{display:grid;width:48px;height:48px;margin:0 auto 24px;place-items:center;color:#9bcaff;background:#101d2b;border:1px solid #263b52;border-radius:12px;font-size:22px}
    .eyebrow{color:#1687ff;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:12px 0;color:#f3f3f3;font-size:30px;letter-spacing:-.04em}
    p{margin:0;color:#929292;font-size:14px;line-height:1.7}
    .rule{width:42px;height:2px;margin:24px auto 0;background:#1687ff;border-radius:2px;opacity:.75}
    @media(max-width:480px){main{padding:32px 22px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">◈</div>
    <div class="eyebrow">CLOXIN</div>
    <h1>Site Offline</h1>
    <p>Sitemiz şu anda bakımda. Kısa süre içinde tekrar yayında olacağız.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
