name: Deploy to VDS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to VDS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "."
          target: "/var/www/html"
          rm: false

      - name: Install bot and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd /var/www/html
            rm -rf node_modules
            npm ci --omit=dev
            node -e "const p=require('./node_modules/discord.js/package.json'); if (p.version !== '14.27.0' || p.main !== './src/index.js') process.exit(1)"
            sudo systemctl restart cloxin-bot.service