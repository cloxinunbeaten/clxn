- name: Copy Files to VDS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "."
          target: "/var/www/html"
          rm: true # İşte bu ayar her seferinde hedef klasörü sıfırlayıp temiz bir kopya oluşturur