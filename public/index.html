<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloxin | Profile</title>
<meta name="description" content="sa">
<meta name="theme-color" content="#4b4b4b">
<meta property="og:type" content="profile">
<meta property="og:title" content="Cloxin | Profile">
<meta property="og:description" content="sa">
<meta property="og:url" content="https://cloxinunbeaten.xyz/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23333' stroke='%23a0a0a0' stroke-width='2'/%3E%3Cpath d='M20.5 11.5a6 6 0 1 0 0 9' fill='none' stroke='%23f4f5f7' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@700&display=swap">
<link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>

<video class="bg-video" id="bgVideo" src="assets/bg.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
<div class="bg-overlay" aria-hidden="true"></div>

<audio id="bgMusic" src="assets/music.mp3" loop preload="auto"></audio>

<div class="enter-screen" id="enterScreen" role="button" tabindex="0" aria-label="Profili aç ve müziği başlat">
  <div class="enter-title">click to enter...</div>
</div>

<div class="card">
  <div class="avatar-wrap">
    <div class="avatar-ring"></div>
    <div class="avatar-inner">
      <img id="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Discord avatarı">
    </div>
    <img id="avatarDecoration" class="avatar-decoration" alt="" hidden decoding="async" referrerpolicy="no-referrer">
    <div class="status-dot" id="statusDot"></div>
  </div>

  <h1 class="name" id="displayName">Cloxin</h1>
  <p class="tag" id="userTag">yükleniyor…</p>

  <div class="status-line">
    <span class="pip" id="statusPip"></span>
    <span id="statusText">Bağlanıyor…</span>
  </div>

  <div class="activity" id="activityBox">
    <img id="activityImg" src="" alt="">
    <div class="act-text">
      <div class="act-title" id="activityTitle"></div>
      <div class="act-sub" id="activitySub"></div>
    </div>
  </div>

  <div class="bio-wrap" id="bioWrap">
    <div class="divider"></div>
            <p class="bio" id="bioText"></p>
  </div>

  <div class="socials" id="socials"></div>
</div>

<div class="music-control" id="musicControl">
  <button class="social-btn music-toggle" id="musicToggle" type="button" title="Sesi kapat/aç" aria-label="Sesi kapat/aç">
    <span class="eq-bars" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </span>
    <svg class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5Z" fill="currentColor" stroke="none"/>
      <path d="M22 9l-6 6M16 9l6 6"/>
    </svg>
  </button>
  <div class="volume-wrap" id="volumeWrap">
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="30" step="1" title="Ses seviyesi" aria-label="Ses seviyesi">
  </div>
</div>

<div class="view-counter" aria-label="Profil görüntülenme sayısı">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
  <span id="viewCount" aria-live="polite">0</span>
</div>

<script src="assets/js/profile.js" defer></script>
</body>
</html>
